[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_signaling"
version = "0.1.0"
description = "Reinforcement-learning study of emergent signaling between agents under partial observation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Anonymous" }]
keywords = ["reinforcement-learning", "multi-agent", "signaling", "game-theory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "tqdm>=4.65",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "ipykernel>=6.25",
    "scikit-optimize>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_signaling*"]
exclude = ["tests*", "notebooks*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    # Treat the deprecation warnings on the legacy env/runner classes as
    # informational during tests — the golden-run baseline still calls them.
    "ignore::DeprecationWarning:rl_signaling.env",
    "ignore::DeprecationWarning:rl_signaling.simulation",
]

[tool.ruff]
# 110 is a pragmatic ceiling that accommodates the legacy simulation_function /
# temp_simulation_function plotting blocks (slated for removal once notebooks
# migrate) without rewrapping them.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = [
    # We document constructor parameters on the class docstring (Numpy style),
    # not on __init__ itself.
    "D107",
    # D203 / D211 are mutually exclusive; pick one.
    "D203",
    # D212 / D213 likewise; we use D212 (multi-line summary on first line).
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"rl_signaling/__init__.py" = ["D104"]
# The legacy simulation_function / temp_simulation_function carry their
# original formatting (long inline comments, wide unpacking lines) and will
# be removed once notebooks migrate to run_simulation.
"rl_signaling/simulation.py" = ["E501"]
